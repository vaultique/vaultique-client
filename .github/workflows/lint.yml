name: Lint

on: [push]

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Run ESLint
        run: pnpm test:lint
      - name: Run Unit Test
        run: pnpm test:unit
